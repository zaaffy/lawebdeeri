<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Calendario 🧪</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #e5e7eb;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .calendar-card {
            background: #111827;
            border-top: 4px solid #7a0c22;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            max-width: 800px;
            width: 100%;
        }

        h2 { color: #e5e7eb; text-align: center; margin-top: 0; }
        .subtitle { color: #9ca3af; font-size: 13px; text-align: center; margin-bottom: 20px; }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .month-box {
            background-color: #1f2937;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #2d3748;
        }

        .month-name {
            font-size: 12px;
            font-weight: bold;
            color: #fca5a5;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 8px;
        }

        .weekdays-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 9px;
            color: #6b7280;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 10px;
        }

        .day-cell { padding: 4px 0; color: #9ca3af; border-radius: 3px; }
        .day-cell.empty { background: transparent; }

        .day-cell.special-event {
            background-color: #4c0519;
            color: #fecdd3;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #7a0c22;
            transition: all 0.2s ease;
        }

        .day-cell.special-event:hover {
            background-color: #7a0c22;
            color: #ffffff;
            transform: scale(1.2);
            z-index: 10;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box {
            background-color: #111827; border: 2px solid #7a0c22;
            padding: 25px; border-radius: 12px; max-width: 450px; width: 90%;
            position: relative; text-align: center;
        }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; color: #9ca3af; cursor: pointer; }
        .modal-box h3 { margin-top: 10px; color: #fca5a5; font-size: 22px; }
        .modal-box p { color: #e5e7eb; font-size: 15px; line-height: 1.5; margin: 15px 0; }
        .modal-photos { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        .modal-photos img { width: 45%; min-width: 130px; max-height: 130px; object-fit: cover; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="calendar-card">
        <h2>🧪 Entorno de Pruebas: Calendario</h2>
        <p class="subtitle">Edita tus fechas y eventos aquí. Cuando tengas el móvil listo, pasamos esto al index.</p>
        <div class="year-grid" id="yearGrid"></div>
    </div>

    <div class="modal-overlay" id="customModal" onclick="closeModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle">Título</h3>
            <p id="modalText">Mensaje...</p>
            <div class="modal-photos" id="modalPhotos"></div>
        </div>
    </div>

    <script>
        // AQUÍ PUEDES IR AÑADIENDO TODOS LOS DÍAS QUE QUIERAS
        const contenidoDias = {
            "6-20": {
                titulo: "¡FELIZ CUMPLEAÑOS MI NIÑA! 🎂",
                texto: "¡Muchísimas felicidades amor! Espero que te haya gustado este rincón secreto...",
                fotos: ["https://via.placeholder.com/150"]
            }
        };

        function generarCalendarioReal() {
            const yearGrid = document.getElementById('yearGrid');
            const nombresMeses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto"];
            const letrasSemana = ["L", "M", "X", "J", "V", "S", "D"];
            const anio = 2026;

            for (let mes = 0; mes < 8; mes++) {
                const monthBox = document.createElement('div');
                monthBox.className = 'month-box';

                const monthName = document.createElement('div');
                monthName.className = 'month-name';
                monthName.innerText = nombresMeses[mes];
                monthBox.appendChild(monthName);

                const weekdaysHeader = document.createElement('div');
                weekdaysHeader.className = 'weekdays-header';
                letrasSemana.forEach(l => {
                    const d = document.createElement('div');
                    d.innerText = l;
                    weekdaysHeader.appendChild(d);
                });
                monthBox.appendChild(weekdaysHeader);

                const daysGrid = document.createElement('div');
                daysGrid.className = 'days-grid';

                let primerDiaSemana = new Date(anio, mes, 1).getDay();
                primerDiaSemana = primerDiaSemana === 0 ? 6 : primerDiaSemana - 1;
                const totalDias = new Date(anio, mes + 1, 0).getDate();

                for (let e = 0; e < primerDiaSemana; e++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = 'day-cell empty';
                    daysGrid.appendChild(emptyCell);
                }

                for (let dia = 1; dia <= totalDias; dia++) {
                    const dayCell = document.createElement('div');
                    dayCell.className = 'day-cell';
                    dayCell.innerText = dia;

                    const claveDia = `${mes}-${dia}`;
                    if (contenidoDias[claveDia]) {
                        dayCell.classList.add('special-event');
                        dayCell.onclick = () => openModalCalendar(claveDia);
                    }
                    daysGrid.appendChild(dayCell);
                }
                monthBox.appendChild(daysGrid);
                yearGrid.appendChild(monthBox);
            }
        }

        function openModalCalendar(claveDia) {
            const datos = contenidoDias[claveDia];
            document.getElementById('modalTitle').innerText = datos.titulo;
            document.getElementById('modalText').innerText = datos.texto;
            const phtContainer = document.getElementById('modalPhotos');
            phtContainer.innerHTML = "";
            datos.fotos.forEach(rutaFoto => {
                const img = document.createElement('img');
                img.src = rutaFoto;
                phtContainer.appendChild(img);
            });
            document.getElementById('customModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('customModal').classList.remove('active');
        }

        generarCalendarioReal();
    </script>
</body>
</html>
