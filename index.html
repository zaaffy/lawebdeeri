<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido - La Web de Eri</title>
    <style>
        /* Fondo Medianoche Intacto */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0b0f19;
            margin: 0;
            color: #e5e7eb;
        }

                /* Tarjeta en Rojo Carmesí con Relieve 3D Realista */
        .login-card {
            background: #7a0c22; /* Rojo Carmesí Base */
            padding: 40px;
            border-radius: 12px; /* Mantiene tus curvas perfectas */
            text-align: center;
            
            /* EL TRUCO DEL RELIEVE 3D: */
            /* 1. Sombra exterior hacia abajo y la derecha (da el efecto de estar separado del fondo oscuro) */
            /* 2. Sombra interior clara arriba a la izquierda (crea el brillo del borde/bisel donde daría la luz) */
            /* 3. Sombra interior oscura abajo a la derecha (crea la profundidad interna del bloque) */
            box-shadow: 
                12px 12px 25px rgba(0, 0, 0, 0.6), 
                inset 4px 4px 8px rgba(255, 255, 255, 0.15), 
                inset -6px -6px 12px rgba(0, 0, 0, 0.5);
                
            /* Un borde superior ligeramente más claro para simular el canto iluminado en 3D */
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(0, 0, 0, 0.4);
            border-right: 1px solid rgba(0, 0, 0, 0.4);
        }

        h2 {
            color: #ffffff; /* Blanco puro para resaltar en el rojo */
            margin-top: 0;
            margin-bottom: 5px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
        }

        p {
            color: #f3f4f6; /* Texto de la pregunta en un tono claro */
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* Inputs integrados con el nuevo fondo */
        input {
            padding: 12px 15px;
            width: 280px;
            margin: 10px auto;
            border: 1px solid #5c0718;
            border-radius: 6px;
            display: block;
            background-color: #4c0513; /* Más oscuro para que contraste lo que escribes */
            color: #ffffff;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #fca5a5; /* Destacado al escribir */
            background-color: #5c0718;
        }

        input::placeholder {
            color: #991b1b; /* El texto de dentro, oscuro para que no moleste */
        }

        /* El botón ahora en un gris más marcado */
        button {
            padding: 12px 30px;
            background-color: #babcbf; /* Gris acero medio, ya no te quema la córnea */
            color: #111827; /* Texto oscuro para que resalte a la primera */
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s ease-in-out;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        button:hover {
            background-color: #9ca3af; /* Se oscurece un pelín más al pasar el ratón */
            transform: translateY(-1px); /* El mini efecto dinámico de antes */
        }

        .error {
            color: #fca5a5; /* Rosa/Rojo muy claro para que se lea sobre el fondo */
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>La Web de Eri <span style="color: #ffffff;">❤</span></h2>
    <p>Quien eres?</p>
    
    <input type="text" id="userInput" placeholder="Usuario">
    <input type="password" id="passwordInput" placeholder="Contraseña">
    
    <button onclick="checkPassword()">Entrar</button>
    
    <div id="errorMessage" class="error"></div>
</div>

<script src="script.js"></script>
</body>
</html>
